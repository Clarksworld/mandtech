<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <style>
      .ir-red { fill: #E02020; }
    </style>
    <!-- Clip to oval for the letters -->
    <ellipse id="oval" cx="250" cy="155" rx="175" ry="120"/>
    <clipPath id="oval-clip">
      <ellipse cx="250" cy="155" rx="175" ry="120"/>
    </clipPath>
    <clipPath id="oval-clip-inner">
      <ellipse cx="250" cy="155" rx="148" ry="93"/>
    </clipPath>
  </defs>

  <!-- === OVAL RING === -->
  <!-- Full red filled oval -->
  <ellipse cx="250" cy="155" rx="178" ry="123" fill="#E02020"/>
  <!-- Inner cutout (white) to make ring -->
  <ellipse cx="250" cy="155" rx="143" ry="90" fill="white"/>

  <!-- === SWOOSH STRIPE top-right === -->
  <path d="M 190 36 Q 310 10 390 68" stroke="#E02020" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- === SWOOSH STRIPE bottom-left === -->
  <path d="M 112 240 Q 190 280 310 272" stroke="#E02020" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- === Letters I and R on white background inside oval === -->

  <!-- Letter I -->
  <!-- top cap -->
  <rect x="150" y="78" width="62" height="18" rx="4" fill="#E02020"/>
  <!-- stem -->
  <rect x="166" y="78" width="30" height="99" rx="0" fill="#E02020"/>
  <!-- bottom cap -->
  <rect x="150" y="159" width="62" height="18" rx="4" fill="#E02020"/>

  <!-- Letter R -->
  <!-- stem -->
  <rect x="232" y="78" width="30" height="99" rx="0" fill="#E02020"/>
  <!-- bump top bar -->
  <rect x="232" y="78" width="72" height="18" rx="4" fill="#E02020"/>
  <!-- bump curve right side -->
  <rect x="296" y="78" width="20" height="52" rx="4" fill="#E02020"/>
  <!-- bump bottom crossbar -->
  <rect x="232" y="118" width="78" height="18" rx="4" fill="#E02020"/>
  <!-- R leg diagonal -->
  <polygon points="274,136 304,136 340,177 310,177" fill="#E02020"/>

  <!-- === Wordmark === -->
  <text
    x="250"
    y="320"
    font-family="Georgia,'Times New Roman',Times,serif"
    font-size="42"
    font-style="italic"
    fill="#E02020"
    text-anchor="middle"
    letter-spacing="0.5"
  >Ingersoll Rand<tspan font-size="26" baseline-shift="super">®</tspan></text>
</svg>
